<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>משרות · פנחס בורנשטיין</title>
<style>
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-300-normal.woff2) format("woff2");font-weight:300}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-700-normal.woff2) format("woff2");font-weight:600 700}
@font-face{font-family:Geist;src:url(fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
:root{--navy:#0E1838;--gold:#C6A955}
html,body{margin:0;background:var(--navy)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--navy);font-family:Heebo,Geist,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:-40px;background:url(photos/office-bg2.jpg) center/cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,24,56,.55),rgba(14,24,56,.82) 55%,rgba(14,24,56,.95))}
#frame{position:absolute;inset:56px;border:1.5px solid rgba(198,169,85,.55)}
.ly{position:absolute;left:0;top:0;white-space:nowrap;text-align:center}
.kicker{font:500 34px Heebo;letter-spacing:10px;color:var(--gold)}
.rule{display:block;height:2px;background:var(--gold);margin:0 auto}
.row{display:flex;align-items:center;gap:28px;width:800px;padding:30px 0;border-bottom:1px solid rgba(255,255,255,.16);font:400 54px Heebo}
.row b{display:block;width:12px;height:12px;background:var(--gold);transform:rotate(45deg)}
.geist{font-family:Geist,sans-serif;direction:ltr}
svg{display:block;overflow:visible}
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="frame"></div><div id="layers"></div></div>
<script>
// ---------- time grid (measured: 84.66 BPM, 28 beats = 7 bars ≈ 19.8 s) ----------
const P = 0.7086937, L = 28 * P, b = i => i * P;
function S(t, w, z) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const smooth = x => (x = clamp(x), x * x * (3 - 2 * x));

const LOGO = (id) => `<div style="display:flex;flex-direction:column;align-items:center;gap:34px">
  <svg width="200" height="200" viewBox="0 0 100 100"><path class="lc" d="M30.3 22.6 A34 34 0 1 1 30.3 77.4" fill="none" stroke="#C6A955" stroke-width="12" stroke-dasharray="190"/><circle class="ld" cx="38" cy="50" r="6.5" fill="#fff"/></svg>
  <div style="font:300 104px/1 Heebo;letter-spacing:2px">פנחס בורנשטיין</div>
  <i class="rule grow" style="width:180px"></i>
  <div style="font:400 44px Heebo;color:#C6A955;letter-spacing:6px">שירות על בטוח</div></div>`;

// [tin, tout, y, html, group]  — every layer has its own enter/exit so swapped text never overlaps
const LY = [
  [-Infinity, b(3.5), 900, LOGO(), "logo"],
  [b(1), b(3.5), 1380, `<div class="kicker">משרות פנויות</div>`],
  [b(4), b(8), 820, `<div style="font:300 92px/1.15 Heebo">המשרד שלנו מתרחב</div>`],
  [b(5), b(8), 930, `<i class="rule grow" style="width:220px"></i>`],
  [b(6), b(8), 1050, `<div style="font:600 64px/1.3 Heebo">ואנו מגייסים אנשי מקצוע<br>מצטיינים לצוות</div>`],
  [b(8), b(12), 820, `<div style="font:300 84px/1.2 Heebo;opacity:.85">איננו מחפשים כל אחד.</div>`],
  [b(10), b(12), 1000, `<div style="font:700 84px/1.2 Heebo;color:#C6A955">אנו מחפשים את<br>הטובים ביותר.</div>`],
  [b(12), b(17), 560, `<div class="kicker">המשרות</div>`],
  [b(12.5), b(17), 800, `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div style="font:600 80px Heebo">נציג/ת מכירות</div><div style="font:300 44px Heebo;opacity:.85">לבעלי יכולת מכירה מוכחת</div></div>`],
  [b(13.5), b(17), 950, `<i class="rule grow" style="width:120px;opacity:.6"></i>`],
  [b(14.5), b(17), 1100, `<div style="display:flex;flex-direction:column;align-items:center;gap:14px"><div style="font:600 80px Heebo">נציג/ת שירות לקוחות</div><div style="font:300 44px Heebo;opacity:.85">משרה מלאה</div></div>`],
  [b(17), b(22), 520, `<div class="kicker">מה אנו מציעים</div>`],
  [b(17.5), b(22), 700, `<div class="row"><b></b>שכר גבוה ומתגמל</div>`],
  [b(18.5), b(22), 840, `<div class="row"><b></b>תנאים מצוינים</div>`],
  [b(19.5), b(22), 980, `<div class="row"><b></b>סביבת עבודה מקצועית ותומכת</div>`],
  [b(20.5), b(22), 1120, `<div class="row"><b></b>משרד מוביל באשדוד</div>`],
  [b(22), b(25), 760, `<div style="font:300 72px/1.2 Heebo">קורות חיים יש לשלוח לכתובת</div>`],
  [b(22.6), b(25), 920, `<div class="geist" style="font-size:88px;font-weight:500;color:#C6A955;letter-spacing:1px">pb@pbslb.com</div>`],
  [b(23.2), b(25), 1010, `<i class="rule grow" style="width:560px"></i>`],
  [b(24), b(25), 1110, `<div style="font:400 38px Heebo;opacity:.7">פניות מתאימות בלבד ייענו</div>`],
  [b(25), Infinity, 900, LOGO(), "logo"],
];
const host = document.getElementById("layers");
const layers = LY.map(([tin, tout, y, html, g]) => {
  const el = document.createElement("div"); el.className = "ly"; el.innerHTML = html; host.appendChild(el);
  return { el, tin, tout, y, g, rules: [...el.querySelectorAll(".grow")], lc: el.querySelector(".lc"), ld: el.querySelector(".ld"), rows: el.querySelector(".row") };
});

function seek(T) {
  const t = ((T % L) + L) % L, ph = 2 * Math.PI * t / L;
  // slow, periodic drift so the loop point is seamless
  document.getElementById("bg").style.transform = `scale(${1.06 + .025 * Math.sin(ph)}) translateY(${14 * Math.cos(ph)}px)`;
  for (const l of layers) {
    const en = l.tin === -Infinity ? 1 : S(t - l.tin, 9, 1);
    const ex = l.tout === Infinity ? 0 : smooth((t - l.tout) / .3);
    const o = clamp(en * 1.15) * (1 - ex);
    l.el.style.display = o > .002 ? "block" : "none";
    if (o <= .002) continue;
    const blur = (1 - en) * 6 + ex * 6;
    l.el.style.opacity = o;
    l.el.style.filter = blur > .05 ? `blur(${blur}px)` : "none";
    l.el.style.transform = `translate(540px,${l.y + 26 * (1 - en) - 10 * ex}px) translate(-50%,-50%)`;
    const k = l.tin === -Infinity ? 1 : S(t - l.tin - .15, 6, 1);
    l.rules.forEach(r => r.style.transform = `scaleX(${k})`);
    if (l.lc) {
      // the logo instance at the end draws in; the one at the start is already drawn (same final frame)
      const d = l.tin === -Infinity ? 1 : S(t - l.tin - .05, 5, 1);
      l.lc.setAttribute("stroke-dashoffset", 190 * (1 - d));
      l.ld.setAttribute("r", 6.5 * (l.tin === -Infinity ? 1 : S(t - l.tin - .5, 10, 1)));
    }
    if (l.rows) l.rows.style.borderBottomColor = `rgba(255,255,255,${.16 * k})`;
  }
}
window.seek = seek; window.LOOP = L; window.BEAT = P;
window.ready = document.fonts.ready.then(() => seek(0));
if (!/render/.test(location.search)) {
  const au = new Audio("song.mp3"); let t0 = null;
  document.addEventListener("click", () => { au.currentTime = 0; au.play(); t0 = performance.now(); });
  const loop = now => { if (t0 === null) t0 = now; seek((now - t0) / 1000); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
