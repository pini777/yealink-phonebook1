<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>דרושים · פנחס בורנשטיין</title>
<style>
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-700-normal.woff2) format("woff2");font-weight:600 700}
@font-face{font-family:Heebo;src:url(fonts/heebo-hebrew-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Geist;src:url(fonts/Geist-Variable.woff2) format("woff2");font-weight:100 900}
html,body{margin:0;background:#0B1A4A}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0B1A4A;font-family:Heebo,Geist,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:0;background:url(photos/office-bg.jpg) center/cover}
#shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,26,74,.15),rgba(11,26,74,.75) 60%,rgba(11,26,74,.92))}
.ly{position:absolute;left:0;top:0;white-space:nowrap}
.brush{display:inline-block;background:#FFD200;color:#0B1A4A;padding:6px 44px 14px;transform:rotate(-2deg);
  clip-path:polygon(2% 8%,12% 0,30% 6%,52% 1%,74% 5%,92% 0,100% 10%,98% 40%,100% 78%,94% 100%,70% 94%,46% 100%,24% 95%,6% 100%,0 84%,2% 48%)}
.geist{font-family:Geist,sans-serif;direction:ltr}
.card{display:flex;align-items:center;gap:30px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:36px;padding:30px 44px;width:840px;box-sizing:border-box}
.pill{display:flex;align-items:center;gap:20px;background:#FFD200;color:#0B1A4A;border-radius:60px;padding:22px 48px;font-weight:800}
svg{display:block;overflow:visible}
</style>
</head>
<body>
<div id="stage"><div id="bg"></div><div id="shade"></div><div id="flash" style="position:absolute;inset:0;background:#FFD200;opacity:0"></div><div id="layers"></div></div>
<script>
// ---------- time grid (measured: 84.66 BPM, 14 beats ≈ 9.9 s) ----------
const P = 0.7086937, L = 14 * P, b = i => i * P;
function S(t, w, z) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const clamp = (x, a = 0, c = 1) => Math.min(c, Math.max(a, x));
const smooth = x => (x = clamp(x), x * x * (3 - 2 * x));
const Y = "#FFD200";
const ICON = (d, s = 70) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${Y}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  chart: '<path d="M4 20V14M10 20V10M16 20V6M3 20h18M14 4h4v4M18 4l-6 6"/>',
  head: '<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20a3 3 0 0 1-3 2h-3"/>',
  coin: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v4c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 10v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4M5 14v4c0 1.7 3.1 3 7 3s7-1.3 7-3v-4"/>',
  fire: '<path d="M12 22c4 0 7-2.8 7-7 0-4.5-3.5-6.5-4.5-10C12 7 11 9 11 11c-1-.6-2-2-2-3.5C6.5 9.5 5 12 5 15c0 4.2 3 7 7 7z"/>',
  team: '<circle cx="12" cy="8" r="3"/><circle cx="5" cy="10" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M6.5 19a5.5 5.5 0 0 1 11 0M1.5 18a3.6 3.6 0 0 1 5-3.2M22.5 18a3.6 3.6 0 0 0-5-3.2"/>',
  pin: '<path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
  phone: '<path d="M5 3.5h3.5l1.8 4.5-2.3 1.4a11 11 0 0 0 6.6 6.6l1.4-2.3 4.5 1.8V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/>',
  mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/>',
};
const icoDark = d => ICON(d, 46).replace(`stroke="${Y}"`, 'stroke="#0B1A4A"').replace('stroke-width="2"', 'stroke-width="2.4"');

// layers: [tin, tout, x, y, html, kind]  kind: "pop" (scale+blur), "wipe" (brush wipes from the right), "slide"
const LY = [
  [-Infinity, b(2), 540, 790, `<div style="font:800 124px/1 Heebo">מחפשים עבודה</div>`, "pop"],
  [b(1), b(2), 540, 960, `<div class="brush" style="font:800 150px/1.1 Heebo">באשדוד?</div>`, "wipe"],
  [b(2), b(4), 540, 800, `<div style="font:800 140px/1 Heebo">משרדינו גדל</div>`, "pop"],
  [b(3), b(4), 540, 980, `<div class="brush" style="font:800 110px/1.1 Heebo">ומרחיבים את הצוות!</div>`, "wipe"],
  [b(4), b(6), 540, 600, `<div style="font:800 96px Heebo;color:${Y}">דרושים</div>`, "pop"],
  [b(4), b(6), 540, 820, `<div class="card">${ICON(I.chart, 90)}<div><div style="font:800 64px/1.1 Heebo">עובדי מכירות</div><div style="font:800 64px/1.1 Heebo;color:${Y}">תותחים</div></div></div>`, "slide"],
  [b(5), b(6), 540, 1080, `<div class="card">${ICON(I.head, 90)}<div><div style="font:800 58px/1.1 Heebo">עובד/ת לשירות לקוחות</div><div style="font:500 44px/1.3 Heebo;opacity:.85">משרה מלאה</div></div></div>`, "slide"],
  [b(6), b(10), 540, 520, `<div style="font:800 100px Heebo">למה <span class="brush" style="font:800 100px/1.1 Heebo">אצלנו?</span></div>`, "pop"],
  [b(6), b(10), 540, 760, `<div class="card">${ICON(I.coin)}<span style="font:700 60px Heebo">שכר גבוה ומתגמל</span></div>`, "slide"],
  [b(7), b(10), 540, 940, `<div class="card">${ICON(I.fire)}<span style="font:700 60px Heebo">תנאים אש</span></div>`, "slide"],
  [b(8), b(10), 540, 1120, `<div class="card">${ICON(I.team)}<span style="font:700 60px Heebo">אווירה צעירה וכיפית</span></div>`, "slide"],
  [b(9), b(10), 540, 1300, `<div class="card">${ICON(I.pin)}<span style="font:700 60px Heebo">המשרד באשדוד</span></div>`, "slide"],
  [b(10), b(11), 540, 880, `<div style="display:flex;align-items:center;gap:44px;direction:rtl">
    <svg width="230" height="230" viewBox="0 0 100 100"><path id="lc" d="M30.3 22.6 A34 34 0 1 1 30.3 77.4" fill="none" stroke="${Y}" stroke-width="15" stroke-dasharray="190"/><circle id="ld" cx="38" cy="50" r="7" fill="#fff"/></svg>
    <i style="display:block;width:4px;height:250px;background:#fff"></i>
    <div style="text-align:right"><div style="font:700 96px/1.02 Heebo">פנחס<br>בורנשטיין</div><div style="font:500 50px Heebo;color:${Y};margin-top:10px">שירות על בטוח</div></div></div>`, "pop"],
  [b(11), Infinity, 540, 640, `<div style="font:800 104px/1.05 Heebo;text-align:center">שלחו קורות חיים<br><span class="brush" style="font:800 104px/1.1 Heebo">עוד היום!</span></div>`, "pop"],
  [b(12), Infinity, 540, 1040, `<div class="pill geist" style="font-size:76px">${icoDark(I.phone)}055-6761141</div>`, "slide"],
  [b(12) + .18, Infinity, 540, 1210, `<div class="pill geist" style="font-size:64px">${icoDark(I.mail)}pb@pbslb.com</div>`, "slide"],
  [b(13), Infinity, 540, 1400, `<div style="font:600 50px Heebo;opacity:.9">המשרה הבאה שלך מחכה</div>`, "pop"],
];
const host = document.getElementById("layers");
const layers = LY.map(([tin, tout, x, y, html, kind]) => {
  const el = document.createElement("div"); el.className = "ly"; el.innerHTML = html; host.appendChild(el);
  return { el, tin, tout, x, y, kind, br: [...el.querySelectorAll(".brush")] };
});
const BEATS_HIT = [1, 3, 4, 6, 10, 11, 12];

function seek(T) {
  const t = ((T % L) + L) % L;
  // background: slow push-in, a punch on strong beats
  let punch = 0; for (const i of BEATS_HIT) punch += .025 * (S(t - b(i), 30, 1) - S(t - b(i) - .08, 14, 1));
  document.getElementById("bg").style.transform = `scale(${1.08 + .06 * t / L + punch})`;
  document.getElementById("flash").style.opacity = .22 * (S(t - b(2), 40, 1) - S(t - b(2) - .05, 12, 1)) + .22 * (S(t - b(10), 40, 1) - S(t - b(10) - .05, 12, 1));
  for (const l of layers) {
    const en = l.tin === -Infinity ? 1 : S(t - l.tin, 18, .8);
    const ex = l.tout === Infinity ? 0 : smooth((t - l.tout) / .12);
    const o = (l.tin === -Infinity ? 1 : clamp((t - l.tin) / .08)) * (1 - ex);
    l.el.style.display = o > .002 ? "block" : "none";
    if (o <= .002) continue;
    let tr = "", blur = ex * 10;
    if (l.kind === "pop") { tr = `scale(${.82 + .18 * en})`; blur += (1 - clamp(en)) * 12; }
    if (l.kind === "slide") { tr = `translateX(${-160 * (1 - en)}px)`; blur += (1 - clamp(en)) * 8; }
    if (l.kind === "wipe") tr = `scale(${1 + .06 * (1 - en)})`;
    l.br.forEach(e => { const k = clamp(S(t - l.tin - (l.kind === "wipe" ? 0 : .12), 16, 1)); e.style.clipPath = ""; e.style.transform = `rotate(-2deg) scaleX(${l.tin === -Infinity ? 1 : k})`; e.style.transformOrigin = "right center"; });
    l.el.style.opacity = o;
    l.el.style.filter = blur > .05 ? `blur(${blur}px)` : "none";
    l.el.style.transform = `translate(${l.x}px,${l.y}px) translate(-50%,-50%) ${tr}`;
  }
  const lc = document.getElementById("lc"); lc.setAttribute("stroke-dashoffset", 190 * (1 - S(t - b(10) - .05, 10, 1)));
  document.getElementById("ld").setAttribute("r", 7 * S(t - b(10) - .25, 18, .82));
  // CTA pills pulse on each beat at the end
  const pulse = t > b(13) ? .04 * Math.exp(-((t - b(13)) % (P / 2)) * 9) : 0;
  layers[14].el.firstChild.style.transform = `scale(${1 + pulse})`;
}
window.seek = seek; window.LOOP = L; window.BEAT = P;
window.ready = document.fonts.ready.then(() => seek(0));
if (!/render/.test(location.search)) {
  const au = new Audio("song.mp3"); let t0 = null;
  document.addEventListener("click", () => { au.currentTime = 0; au.play(); t0 = performance.now(); });
  const loop = now => { if (t0 === null) t0 = now; seek((now - t0) / 1000); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}
</script>
</body>
</html>
